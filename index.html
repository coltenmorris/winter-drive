<script type="text/plain" id="src"># art.py: a convertible, driving nowhere in the snow
import numpy as np
from term import Canvas

W, H = 200, 110
YAW, PITCH, SCALE, ROW0 = -0.32, 0.26, 20, 40
UPHILL = 0.105
ROAD_SLOPE = 0.085
TAU = 2 * np.pi
DRAW = (0.3, 3.2)       # the outline sweeps in
REV = (4.6, 7.2)        # the wheels spin up once it's built
TOP = 112               # mph, going nowhere
INK = ".,:;-~=+rtcvxzjf{}<>ou[]neaQ0$8B&#%"

def smooth(a, b, t):
    x = np.clip((t - a) / (b - a), 0, 1)
    return x * x * (3 - 2 * x)

# the body: a rounded superellipse swept nose to tail
def profile(x):
    hood = 0.84 - 0.34 * (np.clip(x - 0.95, 0, 1.17) / 1.17) ** 2
    deck = 0.86 + 0.04 * np.exp(-((x + 1.3) / 0.4) ** 2) \
        - 0.2 * (np.clip(-x - 1.5, 0, 0.62) / 0.62) ** 2
    top = np.where(x > 0.95, hood, np.where(x < -0.8, deck, 0.80))
    bot = 0.24 + 0.1 * (np.clip(abs(x) - 1.7, 0, 0.42) / 0.42) ** 2
    w = 0.88 * np.sqrt(np.clip(1 - (x / 2.15) ** 6, 0, 1))
    return top, bot, w + 0.04 * np.exp(-((x + 1.3) / 0.5) ** 2)

def fenders(x):
    return sum(np.exp(-((x - cx) / 0.35) ** 2) for cx in (-1.3, 1.28))

def body(n=3.0):
    x, th = np.meshgrid(np.arange(-2.12, 2.12, 0.02), np.linspace(0, TAU, 176))
    top, bot, w = profile(x)
    c, s = np.cos(th), np.sin(th)
    z = w * np.sign(c) * abs(c) ** (2 / n)
    y = (top + bot) / 2 + (top - bot) / 2 * np.sign(s) * abs(s) ** (2 / n)
    y += 0.06 * fenders(x) * np.clip(s, 0, 1) * abs(c)
    cockpit = (x > -0.8) & (x < 0.95) & (s > 0) & (abs(z) < w - 0.1)
    arch = (abs(c) > 0.45) & (np.hypot(abs(x) - 1.28, y - 0.36) < 0.43)
    return np.stack([x, y, z], -1)[~(cockpit | arch)]

def windshield(n=40):
    u, v = np.meshgrid(np.linspace(-1, 1, n), np.linspace(0, 1, n // 3))
    pane = np.ones_like(u, bool)          # tinted glass in a chrome frame
    p = np.stack([0.95 - 0.36 * v - 0.12 * u ** 2, 0.84 + 0.3 * v - 0.05 * u ** 2, 0.7 * u], -1)
    return p[pane]

# wheels: tread and rim, spokes turning with the road
def wheel(cx, cz, spin, r=0.36, rim=0.25):
    a, rr = np.meshgrid(np.linspace(0, TAU, 80), np.linspace(0, r, 40))
    face = np.stack([cx + rr * np.cos(a), 0.36 + rr * np.sin(a), cz + 0 * a], -1)
    spokes = np.cos(5 * (a + spin)) > 0.45   # rolls forward
    return face, np.where(rr < rim, spokes, False)

# the road slides back under the car; edges and dashes are exact
# lines, one letter per column, picked by where the line sits in the cell
LINE = "\u203e-_"

def road_line(z, cols):
    X = (np.arange(cols) - cols / 2) / SCALE
    x = (X - z * np.sin(YAW)) / np.cos(YAW)
    row = ROW0 + (-x * np.sin(YAW) + z * np.cos(YAW)) * np.sin(PITCH) * SCALE
    return row.astype(int), np.array(list(LINE))[(row % 1 * 3).astype(int)], x

# the horizon tilts with the road so the two stay parallel
def horizon(cols):
    return H * 0.53 + ROAD_SLOPE * (np.arange(cols) - cols / 2)

# the sea: rows of swell between the horizon and the shore,
# with the moon's reflection breaking up on the water
def sea(t, c, r, depth):
    w = np.sin(c * 0.33 * (1.6 - depth) + t * (0.6 + depth) + r * 1.7)
    w += 0.5 * np.sin(c * 0.9 - t * 1.8 + r * 3.1)
    return np.select([w > 1, w > 0.45, w > 0], ["~", "-", "."], " ")

def moonpath(c, depth, moon_col, t):
    half = (1.5 + 9 * depth) * (0.65 + 0.35 * np.sin(t * 2.6))
    return abs(c - moon_col) < half

# camera and moonlight
def view(p, yaw=-0.32, pitch=0.26):
    cy, sy = np.cos(yaw), np.sin(yaw)
    cp, sp = np.cos(pitch), np.sin(pitch)
    x = p[..., 0] * cy + p[..., 2] * sy
    z = -p[..., 0] * sy + p[..., 2] * cy
    y = p[..., 1] * cp - z * sp + UPHILL * x   # road climbs gently
    return np.stack([x, y, p[..., 1] * sp + z * cp], axis=-1)

# a crescent: the moon minus a slightly shifted moon
def crescent(dx, dy):
    inner = (dx - 0.5) ** 2 + dy ** 2
    return (dx * dx + dy * dy <= 1) & (inner > 0.92 ** 2)

MOON = np.array([-0.45, 0.8, 0.55])
MOON /= np.linalg.norm(MOON)

def moonlight(n):
    return 0.18 + 0.82 * np.abs(n @ MOON)

# snow in three layers; the near ones fall in front of the car
FLAKES = np.random.default_rng(7).random((420, 4))

def snow(t, speed):
    depth = 1 + FLAKES[:, 2]
    x = (FLAKES[:, 0] - t * (0.06 + 0.3 * speed) * depth) % 1
    y = (FLAKES[:, 1] + t * 0.07 * depth) % 1
    x += 0.01 * np.sin(t * 2 + FLAKES[:, 3] * TAU)
    return x * W, y * H, FLAKES[:, 2]

# the paint is never quite still: letters drift slowly and a soft
# highlight glides along the body every few seconds
def paint(l, c, r, t):
    sweep = ((t * 0.22) % 1.4 - 0.2) * W
    return np.minimum(1, l + 0.22 * np.exp(-((c - sweep + 0.6 * r) / 5) ** 2))

# built from the ground up: tires trace their circles, a weld line
# climbs the body, the cabin blinks in, then glass, then the lights
def built(kind, p, t):
    if kind == "wheel":
        return (p.angle + np.pi / 2) % TAU / TAU < smooth(0.3, 1.5, t)
    if kind == "cabin":
        return t > 2.7 + p.seed
    if kind == "glass":
        return p.seed < smooth(3.7, 4.2, t)
    return (p.y - 0.12) / 1.08 < 1.12 * smooth(1.3, 3.8, t)

def weld(p, t):
    k = (p.y - 0.12) / 1.08
    return abs(k - 1.12 * smooth(1.3, 3.8, t)) < 0.05

def edge_char(vx, vy):
    a = np.degrees(np.arctan2(abs(vy), abs(vx)))
    if a < 22.5:
        return "|"
    if a > 67.5:
        return "_" if vy > 0 else "-"
    return "/" if vx * vy > 0 else "\\"

def frame(t):
    speed = smooth(*REV, t)
    bob = 0.0                 # planted on the road, no bounce
    cv = Canvas(W, H)
    drawn = smooth(*DRAW, t)
    cv.sky(moon=crescent, at=(0.76, 0.14), twinkle=2.3, stars=0.05, glitter=260, reveal=drawn)
    cv.road(road_line, dashes=speed * 14 * t, horizon=horizon)
    car = np.concatenate([body(), windshield()]) + [0, bob, 0]
    cv.splat(view(car), light=moonlight, part="body")
    for cx in (-1.28, 1.28):
        for cz in (-0.82, 0.82):
            cv.splat(view(wheel(cx, cz, speed * t * 7)), part="wheel")
    cv.reveal(smooth(*DRAW, t))
    cv.outline(edge_char)
    cv.sea(sea, drift=speed * 70 * t, reflect=moonpath, shore=2, reveal=drawn)
    cv.ribbon(trail, y=(0.17, 0.30), alpha=speed)
    cv.snow(*snow(t, speed))
    cv.hud(mph=round(TOP * speed))
    return cv

if __name__ == "__main__":
    Canvas.run(frame, fps=30)
</script>

    for (const g of GLINTS) {
      const ph = ((t + g.ph) % g.per) / g.per;
      if (ph > 0.5) continue;
      const k = Math.sin(ph / 0.5 * PI);
      const gc = Math.floor((mx + Math.cos(g.a) * g.d * Rm) / cellW), gr = Math.floor((my - Math.sin(g.a) * g.d * Rm) / cellH);
      const q = (c, r, ch, a) => { if (c <= sweepCol && empty(c, r) && !inCity(c, r)) put(c, r, ch, glow("star", a)); };
      q(gc, gr, k > 0.6 ? "*" : "+", 0.3 + 0.7 * k);
      const L = Math.round(k * g.size);
      for (let dd = 1; dd <= L; dd++) { const a = k * (1 - dd / (L + 1)); q(gc - 2 * dd, gr, "-", a); q(gc + 2 * dd, gr, "-", a); q(gc - 2 * dd + 1, gr, "-", a * 0.8); q(gc + 2 * dd - 1, gr, "-", a * 0.8); q(gc, gr - dd, "|", a); q(gc, gr + dd, "|", a); }
    }
  }

  // snowy ground under a horizon tilted to run parallel with the road
  const LINE = ["‾", "-", "_"];
  const lineCh = py => { const f = py / cellH - Math.floor(py / cellH); return LINE[Math.min(2, Math.floor(f * 3))]; };
  for (let c = 0; c < cols; c++) {
    const hpy = horizonPy((c + 0.5) * cellW), hr = Math.floor(hpy / cellH);
    if (empty(c, hr) && !inCity(c, hr)) put(c, hr, lineCh(hpy), glow("ground", 0.4));
    // where the far road edge sits in this column: the sea runs from the horizon to a thin shore above it
    const X = ((c + 0.5) * cellW - cx0) / scale, rx = (X + 1.74 * syw) / cyw;
    const shore = Math.floor(proj(rx, 0, -1.74)[1] / cellH) - 2;
    const mc = moonGeo().mx / cellW;
    for (let r = hr + 1; r < rows; r++) {
      if (!empty(c, r) || inCity(c, r)) continue;
      const h = hash(c, r);
      if (r < shore) {
        if (c > sweepCol) continue;
        const d = (r - hr) / Math.max(1, shore - hr);
        // moonlight path breaking up on the water
        const half = 1.5 + 9 * d, dc = Math.abs(c + 0.5 - mc);
        const wob = half * (0.65 + 0.35 * Math.sin(t * 2.6 + r * 1.9));
        if (dc < wob && hash(c, r + Math.floor(t * 7)) < 0.75 * (1 - dc / wob) + 0.15) {
          const k = 1 - dc / wob;
          put(c, r, k > 0.6 ? "=" : k > 0.3 ? "-" : "~", glow("warm", 0.35 + 0.55 * k * (0.7 + 0.3 * Math.sin(t * 5 + c))));
          continue;
        }
        // swell: tight lines near the horizon, broader rolling rows toward the shore
        const cc = c + seaPos * (0.25 + 0.75 * d) / cellW;
        const w = Math.sin(cc * 0.33 * (1.6 - d) + t * (0.6 + d) + r * 1.7) + 0.5 * Math.sin(cc * 0.9 - t * 1.8 + r * 3.1);
        if (w > 1.0) put(c, r, "~", glow("sea", 0.35 + 0.3 * d));
        else if (w > 0.45) put(c, r, "-", glow("sea", 0.2 + 0.25 * d));
        else if (w > 0 && h < 0.35) put(c, r, ".", glow("sea", 0.14 + 0.12 * d));
        continue;
      }
      if (r < shore + 2) { if (h < 0.55) put(c, r, h < 0.25 ? "." : h < 0.4 ? "," : "_", glow("ground", 0.45)); continue; }
      const depth = (r - hr) / Math.max(1, rows - hr);
      if (h < 0.1 + 0.12 * depth) put(c, r, h < 0.05 ? "." : h < 0.08 ? "," : "~", glow("ground", 0.12 + 0.28 * depth));
    }
  }
  // the road: surface plus edges and centre dashes drawn as exact lines
  const roadPy = (px, z) => { const X = (px - cx0) / scale, x = (X - z * syw) / cyw; return [proj(x, 0, z)[1], x]; };
  for (let c = 0; c < cols; c++) {
    const px = (c + 0.5) * cellW;
    if (px > sweepCol * cellW) continue;
    const [farPy] = roadPy(px, -1.74), [nearPy] = roadPy(px, 1.74), [midPy, midX] = roadPy(px, 0);
    const rf = Math.floor(farPy / cellH), rn = Math.floor(nearPy / cellH), rm = Math.floor(midPy / cellH);
    for (let r = rf + 1; r < rn; r++) {
      if (r === rm || !empty(c, r)) continue;
      const py = (r + 0.5) * cellH, A = (px - cx0) / scale, Y = 0.6 - (py - TILT * (px - cx0) - cy0) / scale, z1 = -Y / spt;
      const gx = A * cyw - z1 * syw, gz = A * syw + z1 * cyw;
      let l = 0.22 + 0.2 * hash(c, r * 3 + 1);
      if (gx > 1.9) { const cone = 0.55 + (gx - 2) * 0.17; if (Math.abs(gz) < cone) l += 0.7 * (1 - clamp((gx - 2) / 6, 0, 1)) * (1 - Math.abs(gz) / cone * 0.6); }
      put(c, r, INK[clamp(Math.floor(l * 9), 0, 9)], lit("road", l));
    }
    if (empty(c, rf)) put(c, rf, lineCh(farPy), lit("line", 0.7));
    if (empty(c, rn)) put(c, rn, lineCh(nearPy), lit("line", 0.9));
    const dash = ((((midX + roadShift) % 1.6) + 1.6) % 1.6) < 0.8;
    if (dash && empty(c, rm)) put(c, rm, lineCh(midPy), lit("dash", 0.8));
  }

  // background glitter motes
  for (const m of motes) {
    if (!reduce) { m.x += m.vx * dt * (1 + speed); m.y += m.vy * dt; if (m.x < -10) m.x += W + 20; if (m.y < -10) m.y += H * 0.92; }
    const c = Math.floor(m.x / cellW), r = Math.floor(m.y / cellH);
    if (!empty(c, r) || inMoon(c, r) || inCity(c, r)) continue;
    const k = Math.pow(0.5 + 0.5 * Math.sin(t * m.sp + m.ph), 6);
    if (k < 0.08) continue;
    put(c, r, k > 0.75 ? "*" : k > 0.35 ? "+" : "·", glow(m.hue < 0.5 ? "spark" : "star", 0.15 + 0.75 * k));
  }

  // headlight beam
  const h1 = proj(2.0, 0.6 + bob, 0.5), h2 = proj(2.0, 0.6 + bob, -0.5);
  const f1 = proj(7.6, 0.05, 1.5), f2 = proj(7.6, 0.05, -1.5);
  const beamOn = lightsOn;
  const quad = [h1, f1, f2, h2];
  const inBeam = (px, py) => {
    let sgn = 0;
    for (let i = 0; i < 4; i++) {
      const [ax, ay] = quad[i], [bx, by] = quad[(i + 1) % 4];
      const cr = (bx - ax) * (py - ay) - (by - ay) * (px - ax);
      if (cr === 0) continue;
      if (sgn === 0) sgn = Math.sign(cr); else if (Math.sign(cr) !== sgn) return 0;
    }
    const d = Math.hypot(px - (h1[0] + h2[0]) / 2, py - (h1[1] + h2[1]) / 2) / Math.hypot(f1[0] - h1[0], f1[1] - h1[1]);
    return clamp(1 - d, 0, 1);
  };
  if (beamOn) {
    const bc0 = Math.floor(Math.min(...quad.map(q => q[0])) / cellW), bc1 = Math.ceil(Math.max(...quad.map(q => q[0])) / cellW);
    const br0 = Math.floor(Math.min(...quad.map(q => q[1])) / cellH), br1 = Math.ceil(Math.max(...quad.map(q => q[1])) / cellH);
    for (let r = Math.max(0, br0); r <= Math.min(rows - 1, br1); r++) for (let c = Math.max(0, bc0); c <= Math.min(cols - 1, bc1); c++) {
      if (!empty(c, r)) continue;
      const k = inBeam((c + 0.5) * cellW, (r + 0.5) * cellH);
      if (k > 0 && hash(c + Math.floor(t * 6), r) < 0.16) put(c, r, ".", glow("beam", 0.35 * k));
    }
  }

  // far snow (behind the car)
  const flakeBase = -(18 + 225 * speed), shown = Math.floor(flakes.length * snowAmt);
  for (let i = 0; i < flakes.length; i++) {
    const f = flakes[i];
    const depth = 0.5 + f.d;
    if (!reduce) {
      f.x += (flakeBase * depth + 6 * Math.sin(t * 1.7 + f.wob)) * dt;
      f.y += (22 + 38 * f.d) * depth * dt;
      if (f.x < -8) { f.x += W + 16; }
      if (f.y > H + 4) { f.y -= H + 8; f.x = Math.random() * (W + 40); }
    }
    f.c = Math.floor(f.x / cellW); f.r = Math.floor(f.y / cellH);
    if (i >= shown || f.d > 0.72 || hash(i, 3) < 0.45) continue;
    if (!empty(f.c, f.r)) continue;
    const b = beamOn ? inBeam(f.x, f.y) : 0;
    put(f.c, f.r, f.d < 0.3 ? "." : f.d < 0.55 ? "+" : "*", b > 0 ? glow("beam", 0.5 + 0.5 * b) : glow("snow", 0.22 + 0.6 * f.d));
  }

  // the car and road in letters
  letters = 0;
  const eps = 0.05;
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const o = r * cols + c, id = GID[o];
    if (id < 0) continue;
    const l = GL[o];
    const name = partName(id);
    if (id >= 50) continue;
    letters++;
    let vx = 0, vy = 0, nOut = 0;
    const fillOnly = id === 6 || id === 14;
    if (!fillOnly) for (const [dx, dy, w] of NB) {
      const cc = c + dx, rr = r + dy;
      let out;
      if (cc < 0 || rr < 0 || cc >= cols || rr >= rows) out = true;
      else {
        const n = rr * cols + cc, nid = GID[n];
        out = nid < 0 || nid >= 50 || (nid !== id ? (Z[n] < Z[o] - eps || (Math.abs(Z[n] - Z[o]) <= eps && nid < id)) : Z[n] < Z[o] - 0.3);
      }
      if (out) { vx += dx * cellW * w; vy += dy * cellH * w; nOut++; }
    }
    let ch, color;
    if (nOut > 0) {
      if (Math.abs(vx) < 1e-6 && Math.abs(vy) < 1e-6) ch = "|";
      else { const a = Math.atan2(Math.abs(vy), Math.abs(vx)) * 180 / PI; ch = a < 22.5 ? "|" : a > 67.5 ? (vy > 0 ? "_" : "-") : (vx * vy > 0 ? "/" : "\\"); }
      color = name === "body" ? lit("bodyEdge", l) : lit(name, 0.55 + 0.45 * l);
    } else {
      let ll = l;
      let seed = hash(c, r + id * 31);
      if (name === "body" && !reduce) {
        seed = hash(c, r + id * 31 + Math.floor(t * 0.9 + c * 0.06 + r * 0.1 + seed * 3));
        const sweep = ((t * 0.22) % 1.4 - 0.2) * cols;
        ll = Math.min(1, l + 0.22 * Math.exp(-(((c - sweep + r * 0.6) / 5) ** 2)));
      }
      ch = INK[clamp(Math.floor(ll * (INK.length - 1)) + Math.floor(seed * 3) - 1, 0, INK.length - 1)];
      color = lit(name, ll);
    }
    const behindGlass = id === 6 || id === 7 || id === 12 || (id >= 15 && id <= 18);
    if (behindGlass && GM[o]) { ch = GM[o] === 2 ? ":" : "."; color = lit("glass", GM[o] === 2 ? 0.55 : 0.32); }
    if (GS[o]) { ch = hash(c, r + Math.floor(t * 20)) < 0.5 ? "=" : "#"; color = glow("trail", 0.75 + 0.25 * Math.sin(t * 30 + c)); }
    put(c, r, ch, color);
    if (GS[o] && Math.random() < 0.06) {
      sparks.push({ x: (c + 0.5) * cellW, y: (r + 0.5) * cellH, vx: (Math.random() - 0.5) * 70, vy: -Math.random() * 60, life: 1, max: 0.35 + Math.random() * 0.5 });
    }
    if (id >= 20 && id < 34 && wheelP < 1 && Math.random() < 0.02) {
      sparks.push({ x: (c + 0.5) * cellW, y: (r + 0.5) * cellH, vx: (Math.random() - 0.5) * 40, vy: -Math.random() * 40, life: 1, max: 0.3 + Math.random() * 0.4 });
    }
  }

  // faint wireframe dots showing the body still to come
  if (building) for (let o = 0; o < GW.length; o++) {
    if (!GW[o] || GID[o] >= 0) continue;
    put(o % cols, (o / cols) | 0, ".", glow("trail", 0.22));
  }

  // a faint light ribbon off the tail, like a light cycle's wall
  if (speed > 0.01 && reveal >= 1) {
    for (let c = 0; c < cols; c++) {
      const px = (c + 0.5) * cellW, x = ((px - cx0) / scale) / cyw;
      if (x > -2.14 || x < -16) continue;
      const fade = Math.exp(-(-2.14 - x) / 4.5) * speed;
      const shimmer = 0.8 + 0.2 * Math.sin((x + roadPos) * 6 + t * 3);
      const top = proj(x, 0.3, 0)[1], bot = proj(x, 0.17, 0)[1];
      const rt = Math.floor(top / cellH), rb = Math.floor(bot / cellH);
      const f = top / cellH - rt;
      if (empty(c, rt)) {
        ctx.fillStyle = BG; ctx.fillRect(c * cellW, rt * cellH, cellW + 0.5, cellH + 0.5);
        put(c, rt, f < 0.34 ? "‾" : f < 0.67 ? "-" : "_", glow("trail", 0.8 * fade * shimmer));
      }
      for (let r = rt + 1; r <= rb; r++) if (empty(c, r) && hash(c, r + Math.floor(roadPos * 4)) < 0.5) put(c, r, ".", glow("trail", 0.28 * fade * shimmer));
    }
  }

  // glass over open sky: just the glare streaks and a faint sheen
  for (let o = 0; o < GM.length; o++) {
    if (!GM[o] || GID[o] >= 0) continue;
    const c = o % cols, r = (o / cols) | 0;
    put(c, r, GM[o] === 2 ? ":" : ".", lit("glass", GM[o] === 2 ? 0.5 : 0.28));
  }

  // exhaust puffs off the tail
  if (!reduce && speed > 0.05 && Math.random() < 0.35) smoke.push({ x: -2.14, y: 0.32, z: 0.5, life: 1, max: 1 + Math.random() * 0.8, j: Math.random() });
  for (const s of smoke) {
    s.x -= (0.6 + 2.2 * speed) * dt; s.y += 0.25 * dt; s.z += (s.j - 0.5) * 0.3 * dt; s.life -= dt / s.max;
    const [px, py] = proj(s.x, s.y, s.z);
    const c = Math.floor(px / cellW), r = Math.floor(py / cellH);
    if (empty(c, r)) put(c, r, s.life > 0.6 ? "o" : s.life > 0.3 ? "~" : ".", glow("smoke", 0.5 * s.life));
  }
  smoke = smoke.filter(s => s.life > 0);

  // drawing sparks
  for (const p of sparks) {
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 40 * dt; p.life -= dt / p.max;
    const c = Math.floor(p.x / cellW), r = Math.floor(p.y / cellH);
    if (c >= 0 && r >= 0 && c < cols && r < rows) put(c, r, p.life > 0.6 ? "*" : p.life > 0.3 ? "+" : ".", glow("spark", p.life));
  }
  sparks = sparks.filter(p => p.life > 0);
  if (sparks.length > 400) sparks.splice(0, sparks.length - 400);

  // near snow (in front of the car)
  for (let i = 0; i < shown; i++) {
    const f = flakes[i];
    if (f.d <= 0.72 || f.c < 0 || f.r < 0 || f.c >= cols || f.r >= rows) continue;
    const b = beamOn ? inBeam(f.x, f.y) : 0;
    put(f.c, f.r, "*", b > 0 ? glow("beam", 0.6 + 0.4 * b) : glow("snow", 0.55 + 0.45 * (f.d - 0.72) / 0.28));
  }

  return { speed, snowAmt };
}

// ---------- code panel ----------
const SRC = document.getElementById("src").textContent.replace(/^\n/, "").replace(/\s+$/, "");
const LINES = SRC.split("\n");
const TOTAL = SRC.length;
const KW = new Set(["def", "return", "import", "from", "for", "in", "if", "else", "as", "not", "and", "or", "None", "True", "False", "lambda", "while"]);
const BI = new Set(["np", "int", "abs", "max", "min", "len", "range", "round", "Canvas"]);
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
function hl(line) {
  let out = "", prevDef = false, m;
  const re = /(#.*$)|("[^"]*"?|'[^']*'?)|(\b\d+(?:\.\d+)?(?:e-?\d+)?\b)|([A-Za-z_][A-Za-z0-9_]*)|(\s+)|(.)/g;
  while ((m = re.exec(line))) {
    if (m[1]) out += `<span class="c">${esc(m[1])}</span>`;
    else if (m[2]) out += `<span class="s">${esc(m[2])}</span>`;
    else if (m[3]) out += `<span class="n">${m[3]}</span>`;
    else if (m[4]) {
      const w = m[4];
      if (KW.has(w)) out += `<span class="k">${w}</span>`;
      else if (prevDef || BI.has(w)) out += `<span class="f">${w}</span>`;
      else out += w;
      prevDef = w === "def";
      continue;
    }

    if (!m[5]) prevDef = false;
  }
  return out;
}
const HL = LINES.map(hl);
const codeEl = document.getElementById("code"), listEl = document.getElementById("lines");
let lastTyped = -1;
function renderCode(t) {
  const typed = reduce ? TOTAL : Math.min(TOTAL, Math.floor(TOTAL * clamp(t / TYPE_SECONDS, 0, 1)));
  if (typed === lastTyped) return;
  lastTyped = typed;
  let left = typed, cur = 0;
  while (cur < LINES.length - 1 && left > LINES[cur].length) { left -= LINES[cur].length + 1; cur++; }
  const out = [];
  for (let i = 0; i <= cur; i++) {
    const body = i < cur ? HL[i] : hl(LINES[i].slice(0, left)) + '<span class="cursor"></span>';
    out.push(`<li${i === cur ? ' class="cur"' : ""}><span class="ln">${i + 1}</span><span class="tx">${body}</span></li>`);
  }
  listEl.innerHTML = out.join("");
  codeEl.classList.toggle("done", typed >= TOTAL);
  const li = listEl.lastElementChild;
  if (li) codeEl.scrollTop = Math.max(0, li.offsetTop - codeEl.clientHeight * 0.55);
}

// ---------- loop ----------
const clockEl = document.getElementById("clock"), speedEl = document.getElementById("hSpeed"), snowEl = document.getElementById("hSnow"), letEl = document.getElementById("hLetters"), fpsEl = document.getElementById("fps");
let t0 = performance.now(), last = t0, fps = 30, n = 0, wheelAngle = 0, roadPos = 0, skyNear = 0, skyFar = 0, seaPos = 0;
const START = reduce ? 30 : 0;
const pad = (v, w, d) => Math.abs(v).toFixed(d).padStart(w, "0");
function tick(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  if (dt > 0) fps = lerp(fps, 1 / dt, 0.05);
  const t = START + (now - t0) / 1000;
  const sp = smooth(REV[0], REV[1], t);
  wheelAngle += sp * 7 * dt;
  roadPos += sp * 14 * dt;
  if (!reduce) seaPos += sp * 70 * dt;
  if (!reduce) { skyNear += sp * 14 * dt; skyFar += sp * 14 * dt; }
  const st = frame(t, dt);
  renderCode(t);
  if ((n++ % 4) === 0) {
    clockEl.textContent = `t ${pad(t, 5, 2)}s`;
    const mph = Math.round(TOP * st.speed + (st.speed > 0.9 ? 1.0 * Math.sin(t * 1.3) : 0));
    speedEl.textContent = `speed ${pad(mph, 3, 0)} mph`;
    snowEl.textContent = `snow ${(1.8 * st.snowAmt + 0.15 * Math.sin(t * 0.4) * st.snowAmt).toFixed(1)} in/h`;
    letEl.textContent = `letters ${letters.toLocaleString("en-US")}`;
    fpsEl.textContent = `running · ${Math.round(clamp(fps, 1, 240))} fps`;
  }
  requestAnimationFrame(tick);
}
function replay() { t0 = performance.now(); sparks = []; smoke = []; lastTyped = -1; wheelAngle = 0; roadPos = 0; skyNear = 0; skyFar = 0; seaPos = 0; }
document.getElementById("replay").addEventListener("click", replay);
stage.addEventListener("click", e => { if (e.target.tagName !== "INPUT") replay(); });
window.__seek = s => { t0 = performance.now() - s * 1000; };

buildCar();
const ro = new ResizeObserver(() => { resize(); lastTyped = -1; });
const begin = () => { resize(); ro.observe(stage); requestAnimationFrame(tick); };
if (document.fonts && document.fonts.load) document.fonts.load('16px "JetBrains Mono"').then(begin, begin); else begin();
})();
</script>
